# =============================================================================
# OpenClaw Base Image Build — emergency/manual image override
# =============================================================================
# Builds the complete deployable image from sylphx/Dockerfile.base and pushes to
# the internal registry (registry.sylphx.com/library/openclaw-deploy-base).
#
# Tag strategy: {openclaw_version}-deps-{deps_version}
#   openclaw_version: from sylphx/.openclaw-version
#   deps_version:     from sylphx/.openclaw-deps-version
#   → registry.sylphx.com/library/openclaw-deploy-base:{version}-deps-{deps}
#
# Triggers:
#   - Manual dispatch (with optional version overrides)
#
# After build:
#   - The built image is available for a GitOps tenant pin (the OpenClaw
#     tenants are digest-pinned in SylphxAI/infra) or for manual recovery.
#   - This workflow lives at the repo root because GitHub only executes
#     workflows under `.github/workflows/`; it previously sat in `sylphx/`
#     and could therefore never run.
# =============================================================================

name: Build Base Image
# NOTE: Push trigger intentionally removed. Post-cut, OpenClaw tenants are
# digest-pinned by GitOps (SylphxAI/infra) and no platform env auto-deploys;
# this workflow is the manual path that publishes a pinned image.

on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "OpenClaw version (e.g. v2026.3.23) — leave empty to use .openclaw-version"
        required: false
        default: ""
      deps_version:
        description: "Deps version (e.g. v10) — leave empty to use .openclaw-deps-version"
        required: false
        default: ""
      force:
        description: "Force rebuild even if image already exists"
        type: boolean
        default: false

concurrency:
  group: build-base
  cancel-in-progress: false

env:
  REGISTRY: registry.sylphx.com
  IMAGE_NAME: registry.sylphx.com/library/openclaw-deploy-base
  # Workaround target while the Sylphx registry has no robot push credential
  # available to Actions: publish the same recipe to GHCR with the workflow's
  # built-in GITHUB_TOKEN (packages: write). The Sylphx-registry push resumes
  # automatically once secrets.REGISTRY_AUTH exists.
  GHCR_IMAGE: ghcr.io/sylphxai/openclaw-runtime

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push
    runs-on: [self-hosted, sylphx-linux-xlarge]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.versions.outputs.full_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          OPENCLAW_VERSION="${{ github.event.inputs.openclaw_version }}"
          if [ -z "$OPENCLAW_VERSION" ]; then
            OPENCLAW_VERSION=$(cat sylphx/.openclaw-version 2>/dev/null | tr -d '[:space:]' || echo "latest")
          fi

          DEPS_VERSION="${{ github.event.inputs.deps_version }}"
          if [ -z "$DEPS_VERSION" ]; then
            DEPS_VERSION=$(cat sylphx/.openclaw-deps-version 2>/dev/null | tr -d '[:space:]' || echo "v1")
          fi

          FULL_TAG="${OPENCLAW_VERSION}-deps-${DEPS_VERSION}"
          echo "openclaw_version=$OPENCLAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "deps_version=$DEPS_VERSION"         >> "$GITHUB_OUTPUT"
          echo "full_tag=$FULL_TAG"                 >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE_NAME }}:${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "OpenClaw: $OPENCLAW_VERSION  Deps: $DEPS_VERSION  Tag: $FULL_TAG"

      - name: Detect registry credentials
        id: detect
        env:
          REGISTRY_AUTH: ${{ secrets.REGISTRY_AUTH }}
        run: |
          if [ -n "$REGISTRY_AUTH" ]; then
            echo "has_registry_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_registry_auth=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image outputs
        id: meta
        run: |
          if [ "${{ steps.detect.outputs.has_registry_auth }}" = "true" ]; then
            echo "image=${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.full_tag }}" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.full_tag }},${{ env.GHCR_IMAGE }}:${{ steps.versions.outputs.full_tag }}" >> "$GITHUB_OUTPUT"
            echo "cache_ref=${{ env.IMAGE_NAME }}:buildcache" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.GHCR_IMAGE }}:${{ steps.versions.outputs.full_tag }}" >> "$GITHUB_OUTPUT"
            echo "tags=${{ env.GHCR_IMAGE }}:${{ steps.versions.outputs.full_tag }}" >> "$GITHUB_OUTPUT"
            echo "cache_ref=${{ env.GHCR_IMAGE }}:buildcache" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure registry credentials
        # Write docker config.json directly — avoids shell $-expansion issues with
        # robot account names like "robot$ci-push" (the $ would be shell-expanded).
        # The REGISTRY_AUTH secret contains the base64-encoded "user:pass" string
        # exactly as Docker stores it in config.json auths.
        if: steps.detect.outputs.has_registry_auth == 'true'
        env:
          REGISTRY_AUTH: ${{ secrets.REGISTRY_AUTH }}
        run: |
          mkdir -p ~/.docker
          printf '{"auths":{"registry.sylphx.com":{"auth":"%s"}}}' "$REGISTRY_AUTH" \
            > ~/.docker/config.json
          echo "Registry credentials configured"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: sylphx
          file: sylphx/Dockerfile.base
          platforms: linux/amd64
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ steps.versions.outputs.openclaw_version }}
          tags: |
            ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache_ref }},mode=min

      - name: Summary
        run: |
          echo "## ✅ Base image built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.meta.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenClaw | \`${{ steps.versions.outputs.openclaw_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deps | \`${{ steps.versions.outputs.deps_version }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # Deploy removed — Platform reconciler manages all K8s resources.
  # After image push, update desired_image in Platform DB or rollout restart manually.
