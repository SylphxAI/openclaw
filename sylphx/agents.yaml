defaults:
  region: lhr
  # Heap must stay below the container memory limit. The tenant limit is 4Gi and
  # Node also holds non-heap RSS (buffers, native, Chromium children), so a
  # 4096 MB heap yields a ~4288 MB V8 limit inside a 4096 MB cgroup and the
  # kernel OOM-kills the gateway. 3072 MB leaves headroom without shrinking the
  # working set below what the tenants actually use.
  node_options: --max-old-space-size=3072 --dns-result-order=ipv4first
  model:
    primary: deepseek/deepseek-flash
    fallbacks: []
  providers:
    sylphx:
      baseUrl: https://api.sylphx.ai/v1
      timeoutSeconds: 600
      models:
        - id: auto
          name: Auto
          api: openai-responses
          reasoning: true
          input:
            - text
            - image
          contextWindow: 272000
          maxTokens: 64000
deploy:
  domain: claw.sylphx.com
  data_root: /data/volumes
  compose_dir: /data/openclaw
  docker_group: "988"
regions:
